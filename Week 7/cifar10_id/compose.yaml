name: vision10-cifar-id
services:
  web:
    build:
      context: .
      args:
        INFERENCE_DEVICE: cpu
    image: vision10-cifar-id:cpu
    ports:
      - "127.0.0.1:${CIFAR10_ID_PORT:-8001}:8000"
    environment:
      CIFAR10_ID_DEVICE: cpu
      CIFAR10_ID_OFFLINE: "1"
      CIFAR10_ID_MODEL_CACHE: /models
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    volumes:
      - type: bind
        source: ./.cache/models
        target: /models
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 128
    mem_limit: 4g
