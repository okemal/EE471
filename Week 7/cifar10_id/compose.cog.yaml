# Standalone assignment stack: docker compose -f compose.cog.yaml up -d
name: vision10-cifar-id
services:
  cog:
    image: vision10-cifar-id:cog
    ports:
      - "127.0.0.1:${CIFAR10_ID_COG_PORT:-5003}:5000"
    environment:
      CIFAR10_ID_DEVICE: cpu
      CIFAR10_ID_MODEL_CACHE: /models
      CIFAR10_ID_OFFLINE: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ./.cache/models
        target: /models
        read_only: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Cog's generated image already starts with Tini as PID 1.
    pids_limit: 256
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:5000/health-check', timeout=3))['status'] in ('READY','BUSY')"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 3
  web:
    build: .
    image: vision10-cifar-id:cpu
    ports:
      - "127.0.0.1:${CIFAR10_ID_PORT:-8001}:8000"
    environment:
      CIFAR10_ID_COG_URL: http://cog:5000
      CIFAR10_ID_OFFLINE: "1"
    depends_on:
      cog:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 64
    mem_limit: 512m
