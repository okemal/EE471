# Independent from compose.yaml: no credentials, published ports or Azure access.
name: ee471-speech-tests
services:
  studio-tests:
    build:
      context: .
      dockerfile: speech-studio/Dockerfile
      target: test
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777,noexec,nosuid"]
  calculator-tests:
    build:
      context: .
      dockerfile: voice-calculator/Dockerfile
      target: test
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777,noexec,nosuid"]
