# Week 6: Cog generates the inference image and its /predictions HTTP API.
# CPU works with this machine's Docker Desktop; the host launcher can use CUDA.
build:
  gpu: false
  python_version: "3.11"
  sdk_version: "0.23.1"
  python_requirements: requirements-cpu.lock
run: "run.py:Runner"
image: "felis-cat-id:cog"
