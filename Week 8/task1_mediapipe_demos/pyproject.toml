[project]
name = "ee471-week8-mediapipe-demos"
version = "1.0.0"
description = "EE471 Week 8 Task 1: Python demonstrations of all 22 MediaPipe 1.2.3 solutions."
requires-python = ">=3.11,<3.13"
dependencies = [
  "mediapipe==1.2.3",
  "pillow>=11.2,<13",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6.0,<7",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: integration tests that run real MediaPipe inference against cached models",
]

[tool.coverage.run]
source = ["mediapipe_demos", "demos", "run_all"]
branch = true
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
