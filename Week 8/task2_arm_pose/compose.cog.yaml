# Hardened standalone Cog service for Week 8 Task 2:
#   docker compose -f compose.cog.yaml up -d --wait
name: ee471-week8-arm-pose
services:
  cog:
    image: ee471-week8-arm-pose:cog
    ports:
      - "127.0.0.1:${ARM_POSE_COG_PORT:-5004}:5000"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: "Agg"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:5000/health-check', timeout=3))['status'] in ('READY','BUSY')",
        ]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 6
