[project]
name = "week-9"
version = "0.1.0"
description = "EE471 Week 9: Pre-assignment Hugging Face Transformers demos (SmolLM2, OPUS-MT, ViT, Whisper)."
readme = "README.md"
authors = [
    { name = "Onat Kemal Gede", email = "74457146+okemal@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "accelerate>=1.16.0",
    "datasets[audio]>=5.2.0",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sacremoses>=0.2.0",
    "sentencepiece>=0.2.3",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.24.0",
]

[project.scripts]
week-9 = "week_9:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in integration tests that run real Hugging Face model inference",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "N", "SIM", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
