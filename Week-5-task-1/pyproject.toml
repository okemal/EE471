[project]
name = "speech-studio"
version = "0.1.0"
description = "A local Flask website powered by Azure Speech Services"
requires-python = ">=3.11"
dependencies = [
    "azure-cognitiveservices-speech>=1.43,<2",
    "flask>=3.1,<4",
    "flask-sock>=0.7,<1",
    "python-dotenv>=1.1,<2",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
